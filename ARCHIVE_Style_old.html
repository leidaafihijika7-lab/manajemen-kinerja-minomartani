      /* Hilangkan efek pantulan karet browser iOS/Android */

      /* Hilangkan teks tersorot secara tidak sengaja */

    h1,

    #aplikasiUtama {

    .sidebar {

      height: 44px;

      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      font-weight: 600;
      cursor: pointer;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;

      position: relative;
    }

    .menu-item:hover {
      background-color: rgba(255, 255, 255, 0.07);
      color: var(--white);
    }

    .menu-item.active {
      background: rgba(59, 130, 246, 0.18);
      color: #93c5fd;
      border-left-color: #3b82f6;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #f87171;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.15);
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background: rgba(239, 68, 68, 0.2);
    }

    /* ===== CONTENT AREA ===== */
    .content-wrapper {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      min-width: 0;
    }

    .topbar {
      height: 68px;
      height: calc(68px + env(safe-area-inset-top));
      background: var(--white);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 28px;
      padding-top: env(safe-area-inset-top);
      flex-shrink: 0;
      z-index: 10;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }

    .page-title {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-heading);
    }

    .page-title span {
      color: var(--primary);
      font-size: 24px;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: var(--surface-variant);
      border-radius: 30px;
      border: 1px solid var(--border);
    }

    .user-name {
      font-weight: 600;
      color: var(--text-main);
      font-size: 13px;
    }

    .content-body {
      flex: 1;
      padding: 20px 24px;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      background: var(--bg-light);
    }

    .page-section {
      display: none;
      opacity: 0;
    }

    .page-section.active {
      display: block;
      opacity: 1;
      animation: slideUpFade 0.3s ease forwards;
    }

    @keyframes slideUpFade {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== WELCOME CARD ===== */
    .welcome-card {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      padding: 24px 28px;
      border-radius: var(--radius-lg);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.25);
      color: var(--white);
      position: relative;
      overflow: hidden;
    }

    .welcome-card::after {
      content: '';
      position: absolute;
      right: -20px;
      top: -20px;
      width: 160px;
      height: 160px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .avatar-circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      font-family: var(--font-heading);
      flex-shrink: 0;
      z-index: 1;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .welcome-text-wrapper {
      flex-grow: 1;
      z-index: 1;
    }

    .welcome-text-wrapper h2 {
      font-family: var(--font-heading);
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 700;
    }

    .welcome-text-wrapper p {
      margin: 0;
      font-size: 13px;
      opacity: 0.85;
    }

    /* ===== STATS CARDS ===== */
    .stats-container {
      display: flex;
      gap: 14px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .stat-card {
      background: var(--white);
      padding: 18px 20px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      flex: 1;
      min-width: 140px;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }

    .stat-card:active {
      transform: scale(0.98);
    }

    .stat-title {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      line-height: 1.4;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 800;
      font-family: var(--font-heading);
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ===== FORM CARD ===== */
    .form-card {
      background: var(--white);
      padding: 24px 20px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 680px;
      box-shadow: var(--shadow-sm);
    }

    /* ===== TABLE ===== */
    .table-container {
      background: var(--white);
      padding: 0;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      width: 100%;
      overflow-x: auto;
      display: block;
      -webkit-overflow-scrolling: touch;
      box-shadow: var(--shadow-sm);
    }

    /* ===== FORM ELEMENTS ===== */
    .form-group {
      margin-bottom: 18px;
      width: 100%;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 13px;
      color: #374151;
    }

    input[type="text"],
    input[type="date"],
    input[type="month"],
    input[type="password"],
    select,
    textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid #e2e8f0;
      background-color: #f8fafc;
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      color: var(--text-main);
      transition: all 0.2s;
      outline: none;
      /* Prevent iOS zoom on focus */
      font-size: 16px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
      background-color: var(--white);
      box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.1);
    }

    /* ===== FIELD ERROR STYLING ===== */
    input.field-error,
    select.field-error,
    textarea.field-error {
      border-color: var(--danger) !important;
      background-color: #fff5f5;
    }

    input.field-error:focus,
    select.field-error:focus,
    textarea.field-error:focus {
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15) !important;
    }

    input[type="file"] {
      padding: 12px;
      background: #f1f5f9;
      border: 1.5px dashed #cbd5e1;
      border-radius: var(--radius-sm);
      width: 100%;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
    }

    input[type="file"]:hover,
    input[type="file"]:active {
      border-color: var(--primary);
      background: #eff6ff;
    }

    /* ===== SUBMIT BUTTON ===== */
    button.btn-submit {
      background: linear-gradient(135deg, var(--primary) 0%, #3b82f6 100%);
      color: var(--white);
      border: none;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      font-family: var(--font-heading);
      border-radius: var(--radius-md);
      cursor: pointer;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(26, 86, 219, 0.3);
      margin-top: 8px;
      letter-spacing: 0.3px;
    }

    button.btn-submit:active {
      transform: scale(0.98);
      box-shadow: 0 2px 8px rgba(26, 86, 219, 0.25);
    }

    button.btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .55;
      }
    }

    /* ===== FORM SECTIONS (tugas-umum-box) ===== */
    .tugas-umum-box {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 18px 16px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      border-left: 5px solid var(--warning);

      font-weight: 700;
      color: #0f172a;
      margin-top: 0;
      margin-bottom: 16px;

    /* ===== TABLE STYLES ===== */
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 600px;
    }

    th {
      padding: 10px 14px;
      background: #f8fafc;
      color: var(--text-muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
    }

    th:first-child {
      border-top-left-radius: 12px;
    }

    th:last-child {
      border-top-right-radius: 12px;
    }

    td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      vertical-align: top;
      color: var(--text-main);
    }

    tr:last-child td {
      border-bottom: none;
    }

    /* ===== BADGES ===== */
    .badge {
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 20px;
      font-size: 12px;

    /* ===== ACTION BUTTONS ===== */
